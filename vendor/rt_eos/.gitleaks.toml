# Gitleaks config for RT-EOS.
#
# Used by the .githooks/pre-commit hook. Install:
#   - brew install gitleaks            (mac)
#   - https://github.com/gitleaks/gitleaks/releases
#
# Run locally:
#   gitleaks detect --config .gitleaks.toml --redact -v
#   gitleaks protect --staged --config .gitleaks.toml      # pre-commit

[extend]
# Inherit the default ruleset (AWS keys, GitHub tokens, chat tokens, etc.).
useDefault = true

[allowlist]
description = "RT-EOS allowlist - false positives only, never real secrets."

# Paths that legitimately contain high-entropy strings but no real secrets.
paths = [
  # JS/Python dependency trees - third-party code, scanning these just slows
  # the run and produces noise from minified bundles.
  '''(^|[/\\])node_modules([/\\]|$)''',
  '''(^|[/\\])__pycache__([/\\]|$)''',
  # Model weights and sample photos - binary, no secrets.
  '''(^|[/\\])(Models)([/\\]|$)''',
  # Lockfiles - package-lock.json contains integrity hashes that trip
  # generic high-entropy heuristics.
  '''package-lock\.json$''',
  # Server data dir: the auth database. The generated signing key beside it
  # is flagged as a commit failure by a rule below.
  '''(^|[/\\])server[/\\]data[/\\]auth\.db.*$''',
]

# Specific commits in history that already shipped secrets (now rotated).
# Add SHAs here after the secret is revoked + replaced, so future scans
# don't keep re-reporting the same dead leak.
commits = []

# Force-fail the scan when these specific tracked paths are present in a
# commit - even if their contents don't match a known token pattern. They
# must never be pushed.
[[rules]]
id = "rt-eos-signing-key-committed"
description = "the generated signing key and mail token cache in server/data must never be committed"
path = '''server[/\\]data[/\\](signing\.key|mail_token_cache\.json)$'''
regex = '''(?s).*'''

[[rules]]
id = "rt-eos-env-files-committed"
description = "the .env secrets file must never be committed (.env.example is fine)"
path = '''(^|[/\\])\.env(\.(key|local|production|production\.local))?$'''
regex = '''(?s).*'''
