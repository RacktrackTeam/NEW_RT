<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: pinning the scale blocks pinch-zoom
         app-wide, which is the one accommodation a technician squinting at a
         port label in a dark aisle actually needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- color-scheme is set on :root in the stylesheet too, but the Android WebView
         applies force-dark BEFORE the stylesheet loads, inverting light
         surfaces to black on first paint until a tap forced a repaint.
         Declaring it as a
         meta tag here - read before any CSS - stops the first-paint blackout. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>RackTrack</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
  </head>
  <body>
    <!-- Plain words while the app loads, replaced the moment React mounts. -->
    <div id="root">
      <div id="boot" role="status">
        <p>RackTrack</p>
        <div id="boot-bar"><i></i></div>
      </div>
    </div>
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:16px;background:#fff;color:#111;
        font:650 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
      #boot p{margin:0}
      #boot-bar{width:120px;height:3px;border-radius:2px;background:#e9e9e9;overflow:hidden}
      #boot-bar i{display:block;width:40%;height:100%;background:#111;animation:boot-slide 1.1s ease-in-out infinite}
      @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#boot-bar i{animation:none;width:100%;opacity:.35}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
